name: Build & Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: FTPStudio-Linux
            asset_file: FTPStudio-Linux.tar.gz
          - os: windows-latest
            artifact_name: FTPStudio-Windows
            asset_file: FTPStudio-Windows.zip
          - os: macos-latest
            artifact_name: FTPStudio-macOS
            asset_file: FTPStudio-macOS.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Linux : installation de Tkinter
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      # Installation des dépendances sans pymupdf (binaire allégé à ~26 Mo)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter paramiko pyinstaller

      # Build Linux (.tar.gz)
      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "FTPStudio" \
            --collect-all customtkinter \
            main.py
          tar -czf ${{ matrix.asset_file }} -C dist FTPStudio

      # Build Windows (.zip)
      - name: Build Windows Binary
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "FTPStudio" `
            --collect-all customtkinter `
            main.py
          Compress-Archive -Path dist/FTPStudio -DestinationPath ${{ matrix.asset_file }}

      # Build macOS (.zip)
      - name: Build macOS Binary
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "FTPStudio" \
            --collect-all customtkinter \
            main.py
          cd dist && zip -r ../${{ matrix.asset_file }} FTPStudio.app || zip -r ../${{ matrix.asset_file }} FTPStudio

      # Sauvegarde des livrables
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_file }}

      # Publication automatique sur GitHub Releases
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}