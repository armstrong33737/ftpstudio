name: Build & Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_file: FTPStudio-Linux.tar.gz
          - os: windows-latest
            asset_file: FTPStudio-Windows.zip
          - os: macos-latest
            asset_file: FTPStudio-macOS.zip

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Configuration de Python avec cache basé sur requirements.txt
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Linux : installation de Tkinter système
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      # Installation des dépendances Python
      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compilation Linux (.tar.gz)
      - name: Compilation binaire Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "FTPStudio" \
            --collect-all customtkinter \
            --collect-all pyftpdlib \
            --collect-all zeroconf \
            --collect-all qrcode \
            --collect-all pystray \
            --collect-all PIL \
            main.py
          tar -czf ${{ matrix.asset_file }} -C dist FTPStudio

      # Compilation Windows (.zip)
      - name: Compilation binaire Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "FTPStudio" `
            --collect-all customtkinter `
            --collect-all pyftpdlib `
            --collect-all zeroconf `
            --collect-all qrcode `
            --collect-all pystray `
            --collect-all PIL `
            main.py
          Compress-Archive -Path dist/FTPStudio -DestinationPath ${{ matrix.asset_file }}

      # Compilation macOS (.zip)
      - name: Compilation binaire macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "FTPStudio" \
            --collect-all customtkinter \
            --collect-all pyftpdlib \
            --collect-all zeroconf \
            --collect-all qrcode \
            --collect-all pystray \
            --collect-all PIL \
            main.py
          cd dist
          if [ -d "FTPStudio.app" ]; then
            zip -r ../${{ matrix.asset_file }} FTPStudio.app
          else
            zip -r ../${{ matrix.asset_file }} FTPStudio
          fi

      # Publication automatique sur GitHub Release lors d'un tag (ex: git tag v1.0.0)
      - name: Publication sur GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}