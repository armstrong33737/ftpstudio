name: Build & Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: FTPStudio-Linux
            asset_file: FTPStudio-Linux.tar.gz
          - os: windows-latest
            artifact_name: FTPStudio-Windows
            asset_file: FTPStudio-Windows.zip
          - os: macos-latest
            artifact_name: FTPStudio-macOS
            asset_file: FTPStudio-macOS.zip

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Configuration Python avec cache basé sur requirements.txt
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Linux : Tkinter système
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      # Installation via requirements.txt
      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compilation Linux (.tar.gz)
      - name: Compilation binaire Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "FTPStudio" \
            --collect-all customtkinter \
            main.py
          tar -czf ${{ matrix.asset_file }} -C dist FTPStudio

      # Compilation Windows (.zip)
      - name: Compilation binaire Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "FTPStudio" `
            --collect-all customtkinter `
            main.py
          Compress-Archive -Path dist/FTPStudio -DestinationPath ${{ matrix.asset_file }}

      # Compilation macOS (.zip)
      - name: Compilation binaire macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "FTPStudio" \
            --collect-all customtkinter \
            main.py
          cd dist
          if [ -d "FTPStudio.app" ]; then
            zip -r ../${{ matrix.asset_file }} FTPStudio.app
          else
            zip -r ../${{ matrix.asset_file }} FTPStudio
          fi

      # 1. Sauvegarde des livrables (Artifacts GitHub)
      - name: Sauvegarde des livrables (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_file }}

      # 2. Publication sur GitHub Release lors d'un tag
      - name: Publication sur GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}